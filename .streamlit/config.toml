[server]
headless = true
address = "0.0.0.0"
port = 8501
# Allows the app to be embedded in a preview pane / iframe behind a proxy.
# Safe here: the app only ever listens on your own machine.
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4f46e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6fb"
textColor = "#1f2430"
